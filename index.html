<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <div class="card">
        <div class="title">weather app</div>
        <div class="searchcard">
            <input type="tex" placeholder="enter your city">
            <button><img src="/weather-app-img/images/search.png" ></button>
        </div>
        <div class="weather">
            <div class="tempcard">
            <img src="/weather-app-img/images/clear.png" class="weather-icon" >

            <h3 id="temp">27°c</h3>
            <p id="cityname">BHIMAVRAM</p>

        </div>
      <div class="humWind">

    <div class="hum">
        <img src="/weather-app-img/images/humidity.png">

        <div class="humdiv">
            <p class="humvalue">50%</p>
            <p class="name">Humidity</p>
        </div>
    </div>

    <div class="wind">
        <img src="/weather-app-img/images/wind.png">

        <div class="winddiv">
            <p class="windvalue" >26 km/h</p>
            <p class="name">Wind</p>
        </div>
    </div>

</div>
        

</div>



    <script src="weather.js"></script>
</body>
</html>
